<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Solicitação de Materiais</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<h1>Sistema de Solicitação de Materiais</h1>

<!-- DASHBOARD -->
<div class="dashboard">
  <div class="kpi red">
    <span class="kpi-title">Pendentes</span>
    <span class="kpi-value" id="kpiPendentes">0</span>
  </div>
</div>

<!-- NOVA SOLICITAÇÃO -->
<div class="card">
  <input id="doca" placeholder="Doca">
  <input id="solicitante" placeholder="Solicitante">
  <input id="posicao" placeholder="Posição">
  <input id="partnumber" placeholder="Partnumber">
  <input id="quantidade" type="number" placeholder="Quantidade">

  <button onclick="solicitarMaterial()">Solicitar Material</button>
</div>

<!-- ANDAMENTO -->
<div class="card">
  <h3>Solicitações em Andamento</h3>

  <table>
    <thead>
      <tr>
        <th>Doca</th>
        <th>Solicitante</th>
        <th>Posição</th>
        <th>Partnumber</th>
        <th>Qtd</th>
        <th>Solicitado em</th>
        <th>Atraso</th>
        <th>Status</th>
        <th>Ação</th>
      </tr>
    </thead>

    <tbody id="lista">
      <!-- JS INSERE AS LINHAS -->
    </tbody>
  </table>
</div>

<!-- HISTÓRICO -->
<div class="card">
  <h3>Histórico Completo</h3>

  <label>Filtrar por data:</label>
  <input type="date" id="filtroData">
  <button onclick="filtrarHistorico()">Filtrar</button>
  <button onclick="mostrarHistoricoHoje()">Mostrar histórico de hoje</button>
  <button onclick="exportarExcel()">Exportar para Excel</button>

  <table>
    <thead>
      <tr>
        <th>Doca</th>
        <th>Solicitante</th>
        <th>Posição</th>
        <th>Partnumber</th>
        <th>Qtd</th>
        <th>Solicitado em</th>
        <th>Abastecido em</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="historico">
      <!-- JS INSERE AS LINHAS -->
    </tbody>
  </table>
</div>

<!-- GRÁFICOS -->
<div class="card">
  <h3>Gráficos de Abastecimento</h3>
  <canvas id="graficoDiario" height="120"></canvas>
  <canvas id="graficoMensal" height="120"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
