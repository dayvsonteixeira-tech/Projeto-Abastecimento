<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sistema de Abastecimento</title>

<style>

body{
font-family: Arial;
margin:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

th{
background:#f4f4f4;
}

button{
padding:6px 10px;
cursor:pointer;
}

</style>

</head>

<body>

<h2>Solicitações Pendentes</h2>

<table>
<thead>
<tr>
<th>Doca</th>
<th>Solicitante</th>
<th>Posição</th>
<th>Partnumber</th>
<th>Qtd</th>
<th>Comentários</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="listaPendentes"></tbody>

</table>


<h2>Solicitações em Andamento</h2>

<table>

<thead>
<tr>
<th>Doca</th>
<th>Solicitante</th>
<th>Posição</th>
<th>Partnumber</th>
<th>Qtd</th>
<th>Comentários</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="listaAndamento"></tbody>

</table>


<h2>Histórico de Abastecimento</h2>

<div style="margin-bottom:10px">

<label>Data inicial</label>
<input type="date" id="dataInicial">

<label>Data final</label>
<input type="date" id="dataFinal">

<button onclick="filtrarHistorico()">Filtrar</button>

</div>

<table>

<tbody id="listaHistorico"></tbody>

</table>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script src="script.js"></script>

</body>
</html>
